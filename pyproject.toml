[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "keep-it-markdown"
version = "0.8.0"
description = "Converts Google Keep notes to markdown files"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gkeepapi",
    "keyring",
    "click",
    "pillow",
]

[project.scripts]
kim = "kim:main"

[project.optional-dependencies]
dev = [
    "ruff",
]

[tool.setuptools]
py-modules = ["kim", "get_token"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",  # Line too long (avoid flagging existing long strings or comments)
]
